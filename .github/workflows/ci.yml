name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Quality gate and tests
        shell: pwsh
        run: ./scripts/codefactor-check.ps1
      - name: Prepare distribution
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDirectory ./artifacts/fl-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: fl-mcp-windows
          path: artifacts/fl-mcp
